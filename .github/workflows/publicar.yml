name: Publicar

on:
  schedule:
    # Horas en UTC (no cambian con el horario de verano). En Colombia/México: 7:00, 13:00 y 21:00.
    - cron: "0 12 * * *"   # turno de mañana  -> versículo
    - cron: "0 18 * * *"   # turno de tarde   -> reflexión
    - cron: "0 2 * * *"    # turno de noche   -> oración
  workflow_dispatch:
    inputs:
      turno:
        description: "Qué turno publicar"
        type: choice
        options: [manana, tarde, noche]
        default: manana
      simulacro:
        description: "Simulacro: comprueba todo pero NO publica nada"
        type: boolean
        default: true

concurrency:
  group: cola
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      turno: ${{ steps.turno.outputs.turno }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: turno
        name: Elegir turno
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMA: ${{ github.event.schedule }}
          ELEGIDO: ${{ inputs.turno }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            T="$ELEGIDO"
          else
            case "$PROGRAMA" in
              "0 12 * * *") T=manana ;;
              "0 18 * * *") T=tarde ;;
              "0 2 * * *")  T=noche ;;
              *) echo "::error::Programación desconocida: $PROGRAMA"; exit 1 ;;
            esac
          fi
          echo "turno=$T" >> "$GITHUB_OUTPUT"
      - name: Crear la imagen o el vídeo
        run: python -m automatizacion.publicar preparar --turno "${{ steps.turno.outputs.turno }}" --salida sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publicar:
    needs: [preparar, desplegar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          EVENTO: ${{ github.event_name }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          EXTRA=""
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$SIMULACRO" = "true" ]; then EXTRA="--simulacro"; fi
          python -m automatizacion.publicar publicar \
            --turno "${{ needs.preparar.outputs.turno }}" \
            --url-base "${{ needs.desplegar.outputs.page_url }}" $EXTRA
      - name: Guardar el estado de la cola
        if: always()
        run: |
          git config user.name "oracion-de-bolsillo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/cola.json
          if ! git diff --cached --quiet; then
            git commit -m "Estado de la cola"
            git pull --rebase
            git push
          fi
