name: Publicar

on:
  schedule:
    # Cinco piezas diarias. UTC fijo: Bogotá UTC-5, Ciudad de México UTC-6.
    - cron: "17 12 * * *"   # versículo: 07:17 Bogotá / 06:17 México
    - cron: "17 16 * * *"   # reflexión: 11:17 Bogotá / 10:17 México
    - cron: "17 20 * * *"   # reflexión: 15:17 Bogotá / 14:17 México
    - cron: "17 23 * * *"   # oración: 18:17 Bogotá / 17:17 México
    - cron: "17 2 * * *"    # oración: 21:17 Bogotá / 20:17 México del día anterior
  workflow_dispatch:
    inputs:
      turno:
        description: "Qué turno publicar"
        type: choice
        options: [manana, tarde, noche]
        default: manana
      simulacro:
        description: "Simulacro: comprueba todo pero NO publica nada"
        type: boolean
        default: true

concurrency:
  group: cola
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      turno: ${{ steps.turno.outputs.turno }}
      id: ${{ steps.render.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar generación y protección de publicaciones
        run: python -m unittest discover -s automatizacion -p 'test_*.py' -v
      - id: turno
        name: Elegir turno
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMA: ${{ github.event.schedule }}
          ELEGIDO: ${{ inputs.turno }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            T="$ELEGIDO"
          else
            case "$PROGRAMA" in
              "17 12 * * *") T=manana ;;
              "17 16 * * *"|"17 20 * * *") T=tarde ;;
              "17 23 * * *") T=noche ;;
              "17 2 * * *") T=noche ;;
              *) echo "::error::Programación desconocida: $PROGRAMA"; exit 1 ;;
            esac
          fi
          echo "turno=$T" >> "$GITHUB_OUTPUT"
      - id: render
        name: Crear la imagen o el vídeo
        run: python -m automatizacion.publicar preparar --turno "${{ steps.turno.outputs.turno }}" --salida sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publicar:
    needs: [preparar, desplegar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar en Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          EVENTO: ${{ github.event_name }}
          SIMULACRO: ${{ inputs.simulacro }}
        run: |
          EXTRA=""
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$SIMULACRO" = "true" ]; then EXTRA="--simulacro"; fi
          python -m automatizacion.publicar publicar \
            --turno "${{ needs.preparar.outputs.turno }}" \
            --id-preparado "${{ needs.preparar.outputs.id }}" \
            --url-base "${{ needs.desplegar.outputs.page_url }}" $EXTRA
      - name: Guardar el estado de la cola
        if: always()
        run: |
          git config user.name "oracion-de-bolsillo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/cola.json
          if ! git diff --cached --quiet; then
            git commit -m "Estado de la cola"
            git pull --rebase
            git push
          fi
